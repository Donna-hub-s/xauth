name: auth
version: 1.0.0
author: xcore
description: >
  Plugin d'authentification enterprise — multi-tenant, RBAC, audit log,
  invitations par lien, MFA TOTP, JWT RS256, OAuth (Google/GitHub/Discord/Microsoft).

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.0.0"

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: "XAuth"
  base_url: "http://localhost:8000"

# ── Seed — tenant et compte admin créés au démarrage ─────────────────────────
# Toutes les valeurs sont overridables via les variables d'environnement
# correspondantes (ADMIN_EMAIL, ADMIN_PASSWORD, etc.)
seed:
  admin_email: "contact@xcorehub.dev"
  # Jamais de mot de passe en dur ici — doit être fourni via la variable
  # d'environnement ADMIN_PASSWORD (voir env: ci-dessous). Vide ici =
  # build_seed_cfg() (services/seed.py) échoue explicitement au démarrage
  # si ADMIN_PASSWORD n'est pas défini, plutôt que de seeder un compte
  # admin avec un mot de passe public connu (trouvé en clair ici jusqu'à
  # ce commit, et toujours présent dans l'historique git).
  admin_password: ""
  admin_tenant_slug: "default"
  admin_tenant_name: "Default"
  admin_role_name: "admin"
  user_role_name: "user"

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  private_key_path: "conf/private.pem"
  public_key_path: "conf/public.pem"
  access_expire_minutes: 15
  refresh_expire_days: 7

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Limites par route — format: "/chemin": [max_requetes, fenetre_secondes]
# Mettre enabled: false pour désactiver en développement.
rate_limit:
  enabled: true
  routes: {}

# ── Variables d'environnement ─────────────────────────────────────────────────
# Réservées aux secrets qui ne doivent PAS apparaître en clair dans ce fichier.
# Les valeurs des sections app/seed/jwt ci-dessus prennent le dessus si la
# variable d'env est absente ou vide.

envconfiguration:
  inject: true
  env_file: .env

env:
  # Overrides admin seed (optionnels — la section seed: est la source par défaut)
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  ADMIN_TENANT_SLUG: "${ADMIN_TENANT_SLUG}"
  ADMIN_TENANT_NAME: "${ADMIN_TENANT_NAME}"
  ADMIN_ROLE_NAME: "${ADMIN_ROLE_NAME}"
  USER_ROLE_NAME: "${USER_ROLE_NAME}"

  # Overrides JWT (optionnels — la section jwt: est la source par défaut)
  JWT_PRIVATE_KEY_PATH: "${XAUTH_JWT_PRIVATE_KEY_PATH}"
  JWT_PUBLIC_KEY_PATH: "${XAUTH_JWT_PUBLIC_KEY_PATH}"
  JWT_ACCESS_EXPIRE_MINUTES: "${XAUTH_JWT_ACCESS_EXPIRE_MINUTES}"
  JWT_REFRESH_EXPIRE_DAYS: "${XAUTH_JWT_REFRESH_EXPIRE_DAYS}"

  # App URL (optionnel — la section app: est la source par défaut)
  APP_BASE_URL: "${XAUTH_APP_BASE_URL}"
  APP_NAME: "${XAUTH_APP_NAME}"

  # Frontend SPA (marketplace.xcorehub.dev) — cible du redirect navigateur
  # à la fin du flow OAuth (voir routes/oauth.py::callback). Sans ça, le
  # callback n'a nulle part où renvoyer le navigateur et retombe sur le
  # host API lui-même (voir _default_redirect). WEB_REDIRECT_ORIGINS est
  # l'allowlist d'origines pour le paramètre ?redirect= envoyé par le
  # frontend (authApi.oauthUrl) — sans elle, n'importe quel appelant
  # pourrait faire rediriger le navigateur (avec les tokens fraîchement
  # émis en query string) vers un domaine arbitraire (open redirect).
  WEB_APP_URL: "${XAUTH_WEB_APP_URL}"
  OAUTH_WEB_REDIRECT_ORIGINS: "${XAUTH_OAUTH_WEB_REDIRECT_ORIGINS}"


  # OAuth providers — secrets, toujours via env
  OAUTH_GOOGLE_CLIENT_ID: "${XAUTH_OAUTH_GOOGLE_CLIENT_ID}"
  OAUTH_GOOGLE_CLIENT_SECRET: "${XAUTH_OAUTH_GOOGLE_CLIENT_SECRET}"
  OAUTH_GITHUB_CLIENT_ID: "${XAUTH_OAUTH_GITHUB_CLIENT_ID}"
  OAUTH_GITHUB_CLIENT_SECRET: "${XAUTH_OAUTH_GITHUB_CLIENT_SECRET}"
  OAUTH_DISCORD_CLIENT_ID: "${XAUTH_OAUTH_DISCORD_CLIENT_ID}"
  OAUTH_DISCORD_CLIENT_SECRET: "${XAUTH_OAUTH_DISCORD_CLIENT_SECRET}"
  OAUTH_MICROSOFT_CLIENT_ID: "${XAUTH_OAUTH_MICROSOFT_CLIENT_ID}"
  OAUTH_MICROSOFT_CLIENT_SECRET: "${XAUTH_OAUTH_MICROSOFT_CLIENT_SECRET}"

  # Chiffrement des jetons OAuth tiers (Gmail/Calendar...) stockés en base —
  # voir src/services/crypto.py. Distinct des clés JWT (identité xauth). Clé
  # déjà présente en .env (jamais consommée jusqu'ici, service.py en parlait
  # sans que rien ne la lise réellement).
  OAUTH_TOKEN_KEY: "${XAUTH_OAUTH_TOKEN_KEY}"

# ── Permissions inter-plugins ─────────────────────────────────────────────────
permissions:
  - resource: "registry"
    actions: ["*"]
    effect: allow
  - resource: network
    description: "Échange de jetons OAuth (Google/GitHub/Discord/Microsoft) via httpx"
  # Vide = deny_all côté PermissionEngine (même règle que xdevkeys pour son
  # propre namespace "devkeys.*") — sans cette ligne, les actions IPC
  # exposées par src/ipc.py (xauth.get_user, xauth.verify_token, xauth.
  # has_permission, xauth.get_tenant, xauth.create_invite, xauth.log_event)
  # sont injoignables par tout autre plugin malgré leur présence dans le
  # code. Constaté en conditions réelles : marketplace.get_plugin appelle
  # xauth.get_user pour enrichir dev_mail — toujours refusé (permission
  # denied), la fonctionnalité se dégrade silencieusement (dev_mail jamais
  # renseigné) au lieu de simplement fonctionner.
  - resource: "xauth.*"
    actions: ["*"]
    effect: allow

# ── RBAC — catalogue des actions IPC (voir profile/plugin.yaml pour la convention du format) ────────────────
# xauth est la SOURCE des permissions globales (admin:*, tenants:write — voir chat/src/access.py et
# services/seed.py::OWNER_PERMISSIONS) : contrairement à xpulses, ses actions privilégiées référencent ces
# grants globaux existants plutôt que d'en déclarer de nouvelles namespacées "xauth:*".
rbac:
  grants: []
  actions:
    - action: "xauth.verify_token"
      tier: foundational
      requires: []
      description: >
        Établit l'identité elle-même à partir d'un jeton brut — ne peut pas exiger une permission pour être
        appelée, ce serait circulaire (il n'y a pas encore de principal avant qu'elle ne s'exécute).
    - action: "xauth.has_permission"
      tier: foundational
      requires: []
      description: "Répond à « cet utilisateur a-t-il cette permission » pour un appelant quelconque — la gater serait aussi circulaire."
    - action: "xauth.get_user"
      tier: users
      requires: []
      description: "Résout un user_id DÉJÀ connu de l'appelant (project_routes, reminder_notify_bridge) en infos de base (email, actif, MFA) — pas de secret renvoyé."
    - action: "xauth.get_oauth_token"
      tier: users
      requires: []
      description: "Jeton OAuth tiers (Gmail/Calendar…) DE l'appelant — scopé par user_id, jamais celui d'un autre."
    - action: "xauth.log_event"
      tier: users
      requires: []
      description: "Écrit une ligne d'audit — effet de bord disponible à toute action authentifiée normale, pas une opération élevée."
    - action: "xauth.create_invite"
      tier: users
      requires: []
      description: >
        Aucun appelant IPC actuel (grep du 2026-10-07 : rien n'appelle call_plugin("auth", "xauth.create_invite",
        ...) côté chat) — à reclasser dès qu'un vrai appelant existe, probablement tenant_admin si c'est un
        membre qui invite au nom de son espace.
    - action: "xauth.get_tenant"
      tier: admin
      requires: ["admin:*"]
      description: >
        Nom d'un tenant par id — seul appelant : /usage/platform, déjà derrière require_platform_admin côté HTTP.
        Gatée via @action(permissions=["admin:*"]) (xcoreruntime >= 2.8.1) : défense en profondeur, pas le seul filet.
    - action: "xauth.list_members"
      tier: tenant_admin
      requires: ["tenants:write", "admin:*"]  # l'un OU l'autre (owner du tenant OU admin plateforme)
      description: >
        Annuaire d'un espace — seuls appelants : /usage/tenant*, déjà derrière require_tenant_admin côté HTTP.
        PAS ENCORE gatée côté IPC : un simple `permissions=["tenants:write"]` refuserait à tort un admin
        plateforme qui n'est pas owner de CE tenant précis — il faut permission_groups (OU de ET), posé dans
        xcore (uncommitted) mais pas encore publié sur PyPI. TODO déjà dans ipc.py, avec un test qui casse
        exprès quand permission_groups devient disponible.

# ── Ressources ────────────────────────────────────────────────────────────────
resources:
  timeout_seconds: 30
  max_memory_mb: 256
  rate_limit:
    calls: 1000
    period_seconds: 60

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
